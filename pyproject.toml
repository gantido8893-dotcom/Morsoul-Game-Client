[project]
name = "morsoul-client"
version = "0.1.0"
description = "Morsoul: World's Case game launcher and client"
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.12.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "sqlcipher3-wheels>=0.5",
    "keyring>=25",
    "watchdog>=4",
    "platformdirs>=4",
    "cryptography>=42",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-qt>=4",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["morsoul_core", "morsoul_launcher", "morsoul_launcher_ui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
